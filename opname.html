<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opname Rak - CUI / PAU</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#f6f6f6}
  .card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box}
  button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:12px;cursor:pointer}
  .btn-green{background:#16a34a;color:#fff}.btn-blue{background:#2563eb;color:#fff}.btn-white{background:#fff;border:1px solid #ddd}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}
  .ok{color:#16a34a;font-size:13px}.err{color:#dc2626;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h2 style="margin:0">📷 Opname Rak</h2>
  <p style="color:#666;font-size:13px;margin:4px 0 0">CUI / PAU • Supabase: cuipau</p>
  <div id="status" style="font-size:12px;color:#666;margin-top:6px">Loading...</div>
  <label style="font-size:13px;font-weight:600;display:block;margin-top:12px">Kode Rak</label>
  <input id="kodeRak" placeholder="A01-R01-L1A" style="text-transform:uppercase">
  <button class="btn-blue" onclick="loadRak()">Cari Rak</button>
</div>

<div class="card" id="detailCard" style="display:none">
  <h3 id="judulRak" style="margin:0">-</h3>
  <p id="infoRak" style="color:#666;font-size:13px;margin:4px 0 0">-</p>
  <table><thead><tr><th>Barang</th><th>Qty Fisik</th><th>Qty Sistem</th></tr></thead><tbody id="tbody"></tbody></table>
  <label style="font-size:13px;font-weight:600;display:block;margin-top:12px">Nama Operator</label>
  <input id="operator" placeholder="Nama yang opname">
  <label style="font-size:13px;font-weight:600;display:block;margin-top:12px">Catatan</label>
  <input id="catatan" placeholder="Opsional">
  <button class="btn-green" onclick="simpanOpname()">💾 Simpan Opname ke Supabase</button>
  <div id="simpanStatus"></div>
  <button class="btn-white" onclick="location.href='buat-qr-rak.html'">⬅️ Ke Buat QR</button>
</div>

<script>
const SUPABASE_URL = "https://wwvtnnhridolhgfhnfaj.supabase.co";
const SUPABASE_KEY = "sb_publishable_xJ9mRlIlk7s-DW-CskVwjA_mE0vI1YK";
const headers = {apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json"};

let itemsSaatIni = [];

async function loadRak(){
  const kode = document.getElementById("kodeRak").value.trim().toUpperCase();
  if(!kode){ alert("Isi Kode Rak dulu!"); return; }
  document.getElementById("status").innerHTML = "Mencari "+kode+" di Supabase...";
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/racks?kode_rak=eq.${kode}&select=*`, {headers});
    const data = await res.json();
    if(!data.length){ document.getElementById("status").innerHTML = `<span class="err">❌ Rak ${kode} tidak ketemu di Supabase. Buat dulu di Buat QR.</span>`; return; }
    const rak = data[0];
    document.getElementById("detailCard").style.display = "block";
    document.getElementById("judulRak").innerText = rak.kode_rak;
    document.getElementById("infoRak").innerText = `${rak.perusahaan} | ${rak.gudang} | ${rak.keterangan || ""}`;

    const res2 = await fetch(`${SUPABASE_URL}/rest/v1/rack_items?kode_rak=eq.${kode}&select=*&order=created_at.asc`, {headers});
    itemsSaatIni = await res2.json();

    const tbody = document.getElementById("tbody");
    if(!itemsSaatIni.length){
      tbody.innerHTML = `<tr><td colspan="3">Rak masih kosong. Tambah barang dulu di Buat QR / isi manual di bawah:<br><br>
      <input placeholder="Kode Barang" class="item-no"><br>
      <input placeholder="Nama Barang" class="item-desc"></td></tr>`;
    } else {
      tbody.innerHTML = itemsSaatIni.map(x=>`<tr>
        <td><b>${x.item_no}</b><br><span style="color:#666;font-size:12px">${x.item_description||""}</span>
        <input type="hidden" class="item-no" value="${x.item_no}"><input type="hidden" class="item-desc" value="${x.item_description||""}"></td>
        <td><input type="number" class="qty-fisik" placeholder="0" style="width:80px"></td>
        <td><input type="number" class="qty-sistem" placeholder="0" style="width:80px"></td>
      </tr>`).join("");
      // Kalau barang kosong tadi, tambahin class biar ke-save
      if(document.querySelectorAll(".qty-fisik").length===0){
        tbody.innerHTML += `<tr><td colspan="3"><input class="item-no" placeholder="Kode Barang"><input class="item-desc" placeholder="Nama Barang"></td><td><input type="number" class="qty-fisik" value="0"></td><td><input type="number" class="qty-sistem" value="0"></td></tr>`;
      }
    }
    document.getElementById("status").innerHTML = `<span class="ok">✅ Rak ketemu di Supabase</span>`;
  }catch(e){ document.getElementById("status").innerHTML = `<span class="err">❌ Gagal: ${e.message}</span>`; }
}

async function simpanOpname(){
  const kode = document.getElementById("kodeRak").value.trim().toUpperCase();
  const operator = document.getElementById("operator").value || "Operator";
  const rows = [...document.querySelectorAll("#tbody tr")].map(tr=>{
    const no = tr.querySelector(".item-no")?.value;
    if(!no) return null;
    return {
      kode_rak: kode,
      item_no: no.toUpperCase(),
      item_description: tr.querySelector(".item-desc")?.value || "",
      qty_fisik: parseInt(tr.querySelector(".qty-fisik")?.value||0),
      qty_sistem: parseInt(tr.querySelector(".qty-sistem")?.value||0),
      selisih: parseInt(tr.querySelector(".qty-fisik")?.value||0) - parseInt(tr.querySelector(".qty-sistem")?.value||0),
      operator: operator,
      catatan: document.getElementById("catatan").value,
      perusahaan: "PT CUI"
    };
  }).filter(Boolean);
  if(!rows.length){ alert("Isi dulu barangnya!"); return; }
  const el = document.getElementById("simpanStatus");
  el.innerHTML = "Menyimpan...";
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/opname_logs`, {method:"POST", headers:{...headers, Prefer:"return=minimal"}, body: JSON.stringify(rows)});
    if(!res.ok) throw new Error(await res.text());
    el.innerHTML = `<span class="ok">✅ Tersimpan ${rows.length} baris ke Supabase (opname_logs)</span>`;
  }catch(e){
    el.innerHTML = `<span class="err">❌ Gagal simpan: ${e.message}<br>Buat tabel opname_logs dulu di Supabase SQL Editor (lihat bawah).</span>`;
  }
}

// Auto-load kalau dibuka dari QR
const params = new URLSearchParams(location.search);
if(params.get("rak")){
  document.getElementById("kodeRak").value = params.get("rak");
  loadRak();
}
</script>
</body>
</html>
