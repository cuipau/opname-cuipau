<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat QR Rak - CUI / PAU</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;background:#f6f6f6}
  .card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  label{font-size:13px;font-weight:600;display:block;margin-top:12px}
  input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box}
  .row{display:flex;gap:8px}.row>div{flex:1}
  button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:12px;cursor:pointer}
  .btn-blue{background:#2563eb;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-white{background:#fff;border:1px solid #ddd}
  #qrcode{display:flex;justify-content:center;padding:16px}
  .kode{font-size:22px;font-weight:800;text-align:center;letter-spacing:1px}
  .item-row{display:flex;gap:6px;margin-top:6px}
  .ok{color:#16a34a;font-size:13px}.err{color:#dc2626;font-size:13px}
  @media print{body{background:#fff} .no-print{display:none} .card{box-shadow:none}}
</style>
</head>
<body>

<div class="card no-print">
  <h2 style="margin:0">Buat QR Rak Manual</h2>
  <p style="color:#666;font-size:13px;margin:4px 0 0">CUI / PAU - Gudang Semarang • Supabase: cuipau</p>
  <div id="status" style="font-size:12px;margin-top:6px;color:#666">Mengecek koneksi Supabase...</div>

  <label>Perusahaan</label>
  <select id="perusahaan">
    <option value="PT CUI">PT CUI</option>
    <option value="PT PAU">PT PAU</option>
  </select>

  <label>Gudang</label>
  <select id="gudang">
    <option value="W01-01">W01-01 - Warehouse Semarang Pusat</option>
  </select>

  <div class="row">
    <div><label>Lokasi / Blok *</label><input id="lokasi" placeholder="A01" style="text-transform:uppercase"></div>
    <div><label>Rak *</label><input id="rak" placeholder="R01" style="text-transform:uppercase"></div>
  </div>

  <div class="row">
    <div><label>Lantai / Level *</label>
      <select id="lantai"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
    </div>
    <div><label>Posisi *</label>
      <select id="posisi"><option>A</option><option>B</option><option>C</option><option>D</option></select>
    </div>
  </div>

  <label>Keterangan (opsional)</label>
  <input id="keterangan" placeholder="Rak besi / Palet / Lantai">

  <label>Barang di rak ini</label>
  <div id="items"></div>
  <button class="btn-white" onclick="tambahBarang()">+ Tambah Barang</button>

  <button class="btn-blue" onclick="generateQR()">Generate QR</button>
</div>

<div class="card" id="hasil" style="display:none">
  <div class="kode" id="kodeRak">-</div>
  <div style="text-align:center;font-size:13px;color:#666" id="detailRak">-</div>
  <div id="qrcode"></div>
  <div style="text-align:center;font-size:12px;color:#666" id="listBarang"></div>
  <div class="no-print">
    <button class="btn-green" onclick="simpan()">💾 Simpan ke Supabase</button>
    <button class="btn-white" onclick="window.print()">🖨️ Cetak QR</button>
    <button class="btn-white" onclick="location.reload()">Buat Rak Baru</button>
    <div id="simpanStatus"></div>
  </div>
</div>

<div class="card no-print">
  <h3 style="margin:0">Daftar Rak di Supabase <button style="width:auto;padding:6px 10px;margin:0" class="btn-white" onclick="loadDaftar()">🔄 Refresh</button></h3>
  <div id="daftar" style="font-size:13px;margin-top:8px">Loading...</div>
</div>

<script>
// === GANTI KE GITHUB PAGES ===
const BASE_URL = "https://cuipau.github.io/opname-cuipau";
const SUPABASE_URL = "https://wwvtnnhridolhgfhnfaj.supabase.co";
const SUPABASE_KEY = "sb_publishable_xJ9mRlIlk7s-DW-CskVwjA_mE0vI1YK";
const headers = {apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json"};

let kodeTerakhir = "";

function tambahBarang(kode="", desc=""){
  const div = document.createElement("div");
  div.className = "item-row";
  div.innerHTML = `<input placeholder="Kode Barang, ex: LSF-CAP2" value="${kode}" class="item-no">
  <input placeholder="Nama Barang" value="${desc}" class="item-desc">
  <button style="width:40px;margin:0;background:#fee2e2" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById("items").appendChild(div);
}
tambahBarang();

function buatKode(){
  const lokasi = document.getElementById("lokasi").value.trim().toUpperCase();
  const rak = document.getElementById("rak").value.trim().toUpperCase();
  const lantai = document.getElementById("lantai").value;
  const posisi = document.getElementById("posisi").value;
  if(!lokasi || !rak) return null;
  return `${lokasi}-${rak}-L${lantai}${posisi}`;
}

function generateQR(){
  const kode = buatKode();
  if(!kode){ alert("Isi Lokasi dan Rak dulu!"); return; }
  const perusahaan = document.getElementById("perusahaan").value;
  const gudang = document.getElementById("gudang").value;
  const ket = document.getElementById("keterangan").value;
  kodeTerakhir = kode;
  document.getElementById("hasil").style.display = "block";
  document.getElementById("kodeRak").innerText = kode;
  document.getElementById("detailRak").innerText = `${perusahaan} | ${gudang} | ${ket || ""}`;
  const barangs = [...document.querySelectorAll(".item-no")].map((el,i)=>{
    const d = document.querySelectorAll(".item-desc")[i].value;
    return el.value ? `• ${el.value} ${d ? "- "+d : ""}` : "";
  }).filter(Boolean);
  document.getElementById("listBarang").innerHTML = barangs.join("<br>") || "Rak masih kosong - isi barang pas mapping";
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), {
    text: `${BASE_URL}/opname.html?rak=${kode}`,
    width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById("hasil").scrollIntoView({behavior:"smooth"});
}

async function simpan(){
  if(!kodeTerakhir){ alert("Generate QR dulu!"); return; }
  const el = document.getElementById("simpanStatus");
  el.innerHTML = "Menyimpan...";
  const data = {
    kode_rak: kodeTerakhir,
    perusahaan: document.getElementById("perusahaan").value,
    gudang: document.getElementById("gudang").value,
    lokasi: document.getElementById("lokasi").value.trim().toUpperCase(),
    rak: document.getElementById("rak").value.trim().toUpperCase(),
    lantai: parseInt(document.getElementById("lantai").value),
    posisi: document.getElementById("posisi").value,
    keterangan: document.getElementById("keterangan").value,
    qr_url: `${BASE_URL}/opname.html?rak=${kodeTerakhir}`,
    dibuat_oleh: "Admin Gudang"
  };
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/racks`, {
      method:"POST", headers:{...headers, Prefer:"return=minimal"}, body: JSON.stringify(data)
    });
    if(!res.ok){
      const txt = await res.text();
      if(txt.includes("duplicate") || res.status===409){
        el.innerHTML = `<span class="err">⚠️ Rak ${kodeTerakhir} sudah ada di Supabase. Jangan bikin duplikat.</span>`;
        return;
      }
      throw new Error(txt);
    }
    const items = [...document.querySelectorAll(".item-no")].map((inp,i)=>{
      const desc = document.querySelectorAll(".item-desc")[i].value;
      return inp.value ? {kode_rak: kodeTerakhir, item_no: inp.value.trim().toUpperCase(), item_description: desc} : null;
    }).filter(Boolean);
    if(items.length){
      await fetch(`${SUPABASE_URL}/rest/v1/rack_items`, {
        method:"POST", headers:{...headers, Prefer:"return=minimal"}, body: JSON.stringify(items)
      });
    }
    el.innerHTML = `<span class="ok">✅ Tersimpan di Supabase: ${kodeTerakhir}</span>`;
    loadDaftar();
  }catch(e){
    el.innerHTML = `<span class="err">❌ Gagal simpan: ${e.message}. Cek Policy RLS sudah jalan belum.</span>`;
  }
}

async function loadDaftar(){
  const div = document.getElementById("daftar");
  const st = document.getElementById("status");
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/racks?select=kode_rak,perusahaan,gudang,created_at&order=created_at.desc&limit=50`, {headers});
    if(!res.ok) throw new Error(await res.text());
    const list = await res.json();
    st.innerHTML = `<span class="ok">✅ Tersambung ke Supabase - ${list.length} rak</span>`;
    div.innerHTML = list.length ? list.map(x=>`✅ <b>${x.kode_rak}</b> - ${x.perusahaan} - ${x.gudang}<br>`).join("") : "Belum ada rak. Buat yang pertama di atas.";
  }catch(e){
    st.innerHTML = `<span class="err">❌ Belum tersambung: ${e.message}</span>`;
    div.innerHTML = "Gagal load. Cek Policy RLS.";
  }
}
loadDaftar();
</script>
</body>
</html>
