<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUI / PAU - Opname Gudang</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;background:#f6f6f6}
  .card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:#e5e7eb}
  .tab.active{background:#2563eb;color:#fff}
  label{font-size:13px;font-weight:600;display:block;margin-top:12px}
  input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box}
  .row{display:flex;gap:8px}.row>div{flex:1}
  button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:12px;cursor:pointer}
  .btn-blue{background:#2563eb;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-white{background:#fff;border:1px solid #ddd}
  #qrcode{display:flex;justify-content:center;padding:16px}
  .kode{font-size:22px;font-weight:800;text-align:center;letter-spacing:1px}
  .item-row{display:flex;gap:6px;margin-top:6px}
  .ok{color:#16a34a;font-size:13px}.err{color:#dc2626;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{border:1px solid #eee;padding:6px;text-align:left} th{background:#f9fafb}
  @media print{body{background:#fff} .no-print{display:none} .card{box-shadow:none}}
</style>
</head>
<body>

<div class="card no-print" style="text-align:center;padding:12px">
  <h2 style="margin:0">📦 CUI / PAU</h2>
  <p style="color:#666;font-size:13px;margin:4px 0 0">Opname Gudang Semarang • Supabase: cuipau</p>
  <div id="status" style="font-size:12px;margin-top:6px;color:#666">Mengecek koneksi...</div>
</div>

<div class="tabs no-print">
  <button class="tab active" id="tabBtnBuat" onclick="showTab('buat')">🏷️ Buat QR Rak</button>
  <button class="tab" id="tabBtnOpname" onclick="showTab('opname')">📷 Opname</button>
</div>

<!-- ============ TAB BUAT QR ============ -->
<div id="tabBuat">
  <div class="card no-print">
    <h3 style="margin:0">Buat QR Rak Manual</h3>
    <label>Perusahaan</label>
    <select id="perusahaan"><option value="PT CUI">PT CUI</option><option value="PT PAU">PT PAU</option></select>
    <label>Gudang</label>
    <select id="gudang"><option value="W01-01">W01-01 - Warehouse Semarang Pusat</option></select>
    <div class="row">
      <div><label>Lokasi / Blok *</label><input id="lokasi" placeholder="A01" style="text-transform:uppercase"></div>
      <div><label>Rak *</label><input id="rak" placeholder="R01" style="text-transform:uppercase"></div>
    </div>
    <div class="row">
      <div><label>Lantai *</label><select id="lantai"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
      <div><label>Posisi *</label><select id="posisi"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
    </div>
    <label>Keterangan (opsional)</label><input id="keterangan" placeholder="Rak besi / Palet / Lantai">
    <label>Barang di rak ini</label><div id="items"></div>
    <button class="btn-white" onclick="tambahBarang()">+ Tambah Barang</button>
    <button class="btn-blue" onclick="generateQR()">Generate QR</button>
  </div>

  <div class="card" id="hasil" style="display:none">
    <div class="kode" id="kodeRak">-</div>
    <div style="text-align:center;font-size:13px;color:#666" id="detailRak">-</div>
    <div id="qrcode"></div>
    <div style="text-align:center;font-size:12px;color:#666" id="listBarang"></div>
    <div class="no-print">
      <button class="btn-green" onclick="simpanRak()">💾 Simpan ke Supabase</button>
      <button class="btn-white" onclick="window.print()">🖨️ Cetak QR</button>
      <button class="btn-white" onclick="location.reload()">Buat Rak Baru</button>
      <div id="simpanStatus"></div>
    </div>
  </div>

  <div class="card no-print">
    <h3 style="margin:0">Daftar Rak <button style="width:auto;padding:6px 10px;margin:0" class="btn-white" onclick="loadDaftar()">🔄 Refresh</button></h3>
    <div id="daftar" style="font-size:13px;margin-top:8px">Loading...</div>
  </div>
</div>

<!-- ============ TAB OPNAME ============ -->
<div id="tabOpname" style="display:none">
  <div class="card">
    <h3 style="margin:0">Opname Rak</h3>
    <label>Kode Rak *</label>
    <div class="row">
      <div style="flex:2"><input id="opRak" placeholder="A01-R01-L1A" style="text-transform:uppercase"></div>
      <div><button class="btn-blue" style="margin-top:4px" onclick="loadOpname()">Cari Rak</button></div>
    </div>
    <div id="opInfo" style="font-size:13px;margin-top:8px;color:#666">Scan QR rak, atau ketik kode rak lalu Cari Rak.</div>
    <label>Operator</label><input id="opOperator" placeholder="Nama operator" value="Admin Gudang">
    <div id="opTable"></div>
    <div id="opStatus"></div>
    <button class="btn-green" onclick="simpanOpname()" style="display:none" id="btnSimpanOpname">💾 Simpan Hasil Opname</button>
  </div>
  <div class="card no-print">
    <h3 style="margin:0">Riwayat Opname Terakhir <button style="width:auto;padding:6px 10px;margin:0" class="btn-white" onclick="loadRiwayat()">🔄</button></h3>
    <div id="riwayat" style="font-size:13px;margin-top:8px">Loading...</div>
  </div>
</div>

<script>
const BASE_URL = "https://cuipau.github.io/opname-cuipau";
const SUPABASE_URL = "https://wwvtnnhridolhgfhnfaj.supabase.co";
const SUPABASE_KEY = "sb_publishable_xJ9mRlIlk7s-DW-CskVwjA_mE0vI1YK";
const headers = {apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json"};
let kodeTerakhir = "";
let opItems = [];

function showTab(t){
  document.getElementById("tabBuat").style.display = t==="buat" ? "block" : "none";
  document.getElementById("tabOpname").style.display = t==="opname" ? "block" : "none";
  document.getElementById("tabBtnBuat").className = "tab"+(t==="buat"?" active":"");
  document.getElementById("tabBtnOpname").className = "tab"+(t==="opname"?" active":"");
  if(t==="opname") loadRiwayat();
}
function tambahBarang(kode="", desc=""){
  const div=document.createElement("div"); div.className="item-row";
  div.innerHTML=`<input placeholder="Kode Barang, ex: LSF-CAP2" value="${kode}" class="item-no"><input placeholder="Nama Barang" value="${desc}" class="item-desc"><button style="width:40px;margin:0;background:#fee2e2" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById("items").appendChild(div);
}
tambahBarang();
function buatKode(){
  const lokasi=document.getElementById("lokasi").value.trim().toUpperCase();
  const rak=document.getElementById("rak").value.trim().toUpperCase();
  const lantai=document.getElementById("lantai").value;
  const posisi=document.getElementById("posisi").value;
  if(!lokasi||!rak) return null;
  return `${lokasi}-${rak}-L${lantai}${posisi}`;
}
function generateQR(){
  const kode=buatKode(); if(!kode){alert("Isi Lokasi dan Rak dulu!");return;}
  const perusahaan=document.getElementById("perusahaan").value;
  const gudang=document.getElementById("gudang").value;
  const ket=document.getElementById("keterangan").value;
  kodeTerakhir=kode;
  document.getElementById("hasil").style.display="block";
  document.getElementById("kodeRak").innerText=kode;
  document.getElementById("detailRak").innerText=`${perusahaan} | ${gudang} | ${ket||""}`;
  const barangs=[...document.querySelectorAll(".item-no")].map((el,i)=>{const d=document.querySelectorAll(".item-desc")[i].value; return el.value?`• ${el.value} ${d?"- "+d:""}`:"";}).filter(Boolean);
  document.getElementById("listBarang").innerHTML=barangs.join("<br>")||"Rak masih kosong - isi barang pas mapping";
  document.getElementById("qrcode").innerHTML="";
  new QRCode(document.getElementById("qrcode"),{text:`${BASE_URL}/?rak=${kode}`,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  document.getElementById("hasil").scrollIntoView({behavior:"smooth"});
}
async function simpanRak(){
  if(!kodeTerakhir){alert("Generate QR dulu!");return;}
  const el=document.getElementById("simpanStatus"); el.innerHTML="Menyimpan...";
  const data={kode_rak:kodeTerakhir,perusahaan:document.getElementById("perusahaan").value,gudang:document.getElementById("gudang").value,lokasi:document.getElementById("lokasi").value.trim().toUpperCase(),rak:document.getElementById("rak").value.trim().toUpperCase(),lantai:parseInt(document.getElementById("lantai").value),posisi:document.getElementById("posisi").value,keterangan:document.getElementById("keterangan").value,qr_url:`${BASE_URL}/?rak=${kodeTerakhir}`,dibuat_oleh:"Admin Gudang"};
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/racks`,{method:"POST",headers:{...headers,Prefer:"return=minimal"},body:JSON.stringify(data)});
    if(!res.ok){const txt=await res.text(); if(txt.includes("duplicate")||res.status===409){el.innerHTML=`<span class="err">⚠️ Rak ${kodeTerakhir} sudah ada.</span>`;return;} throw new Error(txt);}
    const items=[...document.querySelectorAll(".item-no")].map((inp,i)=>{const desc=document.querySelectorAll(".item-desc")[i].value; return inp.value?{kode_rak:kodeTerakhir,item_no:inp.value.trim().toUpperCase(),item_description:desc}:null;}).filter(Boolean);
    if(items.length){await fetch(`${SUPABASE_URL}/rest/v1/rack_items`,{method:"POST",headers:{...headers,Prefer:"return=minimal"},body:JSON.stringify(items)});}
    el.innerHTML=`<span class="ok">✅ Tersimpan: ${kodeTerakhir}</span>`; loadDaftar();
  }catch(e){el.innerHTML=`<span class="err">❌ Gagal: ${e.message}</span>`;}
}
async function loadDaftar(){
  const div=document.getElementById("daftar"); const st=document.getElementById("status");
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/racks?select=kode_rak,perusahaan,gudang,created_at&order=created_at.desc&limit=50`,{headers});
    if(!res.ok) throw new Error(await res.text());
    const list=await res.json();
    st.innerHTML=`<span class="ok">✅ Tersambung ke Supabase - ${list.length} rak</span>`;
    div.innerHTML=list.length?list.map(x=>`✅ <b>${x.kode_rak}</b> - ${x.perusahaan} - <a href="?rak=${x.kode_rak}">${x.kode_rak} → Opname</a><br>`).join(""):"Belum ada rak.";
  }catch(e){st.innerHTML=`<span class="err">❌ Belum tersambung: ${e.message}</span>`; div.innerHTML="Gagal load.";}
}
async function loadOpname(){
  const kode=document.getElementById("opRak").value.trim().toUpperCase();
  if(!kode){alert("Isi kode rak dulu!");return;}
  const info=document.getElementById("opInfo"); info.innerHTML="Mencari...";
  try{
    const r1=await fetch(`${SUPABASE_URL}/rest/v1/racks?kode_rak=eq.${encodeURIComponent(kode)}&select=*`,{headers});
    const racks=await r1.json();
    const r2=await fetch(`${SUPABASE_URL}/rest/v1/rack_items?kode_rak=eq.${encodeURIComponent(kode)}&select=*&order=id.asc`,{headers});
    const items=await r2.json();
    if(!racks.length){info.innerHTML=`<span class="err">Rak ${kode} tidak ditemukan di Supabase.</span>`; document.getElementById("opTable").innerHTML=""; return;}
    const r=racks[0];
    info.innerHTML=`<b>${r.kode_rak}</b> • ${r.perusahaan} • ${r.gudang} • ${r.keterangan||""}`;
    opItems=items;
    if(!items.length){
      document.getElementById("opTable").innerHTML=`<p style="font-size:13px">Rak ini belum ada barangnya. Tambah manual:</p><div class="row"><div><input id="manualNo" placeholder="Kode Barang"></div><div><input id="manualDesc" placeholder="Nama Barang"></div></div><button class="btn-white" onclick="tambahManual()">+ Tambah Baris</button>`;
      document.getElementById("btnSimpanOpname").style.display="block";
      renderOpTable(); return;
    }
    renderOpTable();
    document.getElementById("btnSimpanOpname").style.display="block";
  }catch(e){info.innerHTML=`<span class="err">Gagal: ${e.message}</span>`;}
}
function renderOpTable(){
  if(!opItems.length){document.getElementById("opTable").innerHTML="<p style='font-size:13px'>Belum ada barang. Tambah manual di atas.</p>"; return;}
  let html=`<table><tr><th>Kode</th><th>Nama</th><th>Qty Sistem</th><th>Qty Fisik</th><th>Catatan</th></tr>`;
  opItems.forEach((it,i)=>{
    html+=`<tr><td>${it.item_no}</td><td>${it.item_description||""}</td><td><input id="qs_${i}" type="number" value="0" style="width:70px"></td><td><input id="qf_${i}" type="number" value="0" style="width:70px"></td><td><input id="ct_${i}" placeholder="-" style="width:90px"></td></tr>`;
  });
  html+=`</table>`;
  const existing=document.getElementById("manualBox");
  document.getElementById("opTable").innerHTML=html;
}
function tambahManual(){
  const no=document.getElementById("manualNo").value.trim().toUpperCase();
  const desc=document.getElementById("manualDesc").value.trim();
  if(!no){alert("Isi kode barang!");return;}
  opItems.push({item_no:no,item_description:desc});
  renderOpTable();
  document.getElementById("manualNo").value=""; document.getElementById("manualDesc").value="";
}
async function simpanOpname(){
  const kode=document.getElementById("opRak").value.trim().toUpperCase();
  const op=document.getElementById("opOperator").value||"Admin Gudang";
  const el=document.getElementById("opStatus"); el.innerHTML="Menyimpan...";
  const rows=opItems.map((it,i)=>{
    const qs=parseInt(document.getElementById(`qs_${i}`)?.value||0);
    const qf=parseInt(document.getElementById(`qf_${i}`)?.value||0);
    const ct=document.getElementById(`ct_${i}`)?.value||"";
    return {kode_rak:kode,item_no:it.item_no,item_description:it.item_description||"",qty_sistem:qs,qty_fisik:qf,selisih:qf-qs,operator:op,catatan:ct};
  });
  if(!rows.length){el.innerHTML=`<span class="err">Belum ada barang.</span>`;return;}
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/opname_logs`,{method:"POST",headers:{...headers,Prefer:"return=minimal"},body:JSON.stringify(rows)});
    if(!res.ok) throw new Error(await res.text());
    el.innerHTML=`<span class="ok">✅ Opname ${kode} tersimpan (${rows.length} item)</span>`; loadRiwayat();
  }catch(e){el.innerHTML=`<span class="err">❌ Gagal: ${e.message} - Cek tabel opname_logs sudah ada belum.</span>`;}
}
async function loadRiwayat(){
  const div=document.getElementById("riwayat");
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/opname_logs?select=kode_rak,item_no,qty_fisik,qty_sistem,selisih,operator,created_at&order=created_at.desc&limit=20`,{headers});
    if(!res.ok) throw new Error(await res.text());
    const list=await res.json();
    div.innerHTML=list.length?list.map(x=>`✅ <b>${x.kode_rak}</b> ${x.item_no} Fisik:${x.qty_fisik} Sistem:${x.qty_sistem} Selisih:${x.selisih} - ${x.operator}<br>`).join(""):"Belum ada opname.";
  }catch(e){div.innerHTML="Gagal load riwayat. Cek tabel opname_logs.";}
}
loadDaftar(); loadRiwayat();
const params=new URLSearchParams(location.search);
const rakParam=params.get("rak");
if(rakParam){ document.getElementById("opRak").value=rakParam.toUpperCase(); showTab("opname"); loadOpname(); }
</script>
</body>
</html>
